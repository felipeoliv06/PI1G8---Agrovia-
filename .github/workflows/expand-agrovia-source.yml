name: Expand Agrovia source package

on:
  push:
    branches:
      - main
    paths:
      - "agrovia-fase4-supabase.zip"

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Expand the reviewed source package
        run: |
          unzip -oq agrovia-fase4-supabase.zip -d .
          rm -f agrovia-fase4-supabase.zip
          rm -f script.js style.css

      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sincroniza fonte Agrovia Fase 4"
            git push origin main
          fi
